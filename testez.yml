# TestEZ globals, merged into Selene's "roblox" std via selene.toml's `std = "roblox+testez"`.
# Must be YAML at the repo root (same directory as selene.toml) — Selene's std
# loader does not resolve TOML files here, only <name>.yml/.yaml.
name: testez
globals:
  describe:
    args:
      - type: string
      - type: function
  it:
    args:
      - type: string
      - type: function
  expect:
    args:
      - type: any
  beforeEach:
    args:
      - type: function
  afterEach:
    args:
      - type: function
  beforeAll:
    args:
      - type: function
  afterAll:
    args:
      - type: function
  FOCUS:
    property: read-only
  SKIP:
    property: read-only
